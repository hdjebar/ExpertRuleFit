name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    # Pinned runner (ubuntu-latest moves without notice). Python 3.9 is not
    # tested: current imodels uses PEP 604 annotations (X | None) at import.
    # CI runs unpinned scikit-learn/NumPy; authoritative numbers come from
    # the pinned docker/ image (docker/requirements.lock.txt).
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --tb=short

  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff==0.17.6  # keep in step with [tool.ruff] in pyproject.toml

      - name: Check formatting
        run: ruff format --check .

      - name: Check linting
        run: ruff check .

      - name: Check no sys.path hacks in examples
        run: |
          if grep -r "sys.path.insert" examples/; then
            echo "ERROR: sys.path.insert found in examples — use pip install -e . instead"
            exit 1
          fi
